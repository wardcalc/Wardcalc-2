<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>CHA₂DS₂-VASc — WardCalc</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="bg-wrap"><div class="bg-mesh"></div><div class="orb orb1"></div></div>
  <nav>
    <a class="logo" href="../index.html"><div class="logo-text">Ward<em>Calc</em></div></a>
    <div class="lang-sw">
      <button class="lang-btn active" onclick="setLang('en',this)">EN</button>
      <button class="lang-btn" onclick="setLang('ru',this)">RU</button>
      <button class="lang-btn" onclick="setLang('uz',this)">UZ</button>
    </div>
  </nav>

  <main class="main">
    <div class="calc-container">
        <a href="../index.html" class="close-btn">&times;</a>
        <div class="spec-tag">Cardiology</div>
        <h1 style="color:var(--gold); font-size:28px;">CHA₂DS₂-VASc Score</h1>
        <p style="color:var(--w60); margin-bottom:25px;">Stroke risk in atrial fibrillation.</p>

        <div style="display:grid; gap:10px; margin-bottom:25px;">
            <button class="chip" data-g="ch_c" data-v="1" onclick="toggleChip(this)">Congestive Heart Failure (+1)</button>
            <button class="chip" data-g="ch_h" data-v="1" onclick="toggleChip(this)">Hypertension (+1)</button>
            <button class="chip" data-g="ch_a2" data-v="2" onclick="toggleChip(this)">Age ≥ 75 (+2)</button>
            <button class="chip" data-g="ch_d" data-v="1" onclick="toggleChip(this)">Diabetes Mellitus (+1)</button>
            <button class="chip" data-g="ch_s2" data-v="2" onclick="toggleChip(this)">Stroke / TIA history (+2)</button>
            <button class="chip" data-g="ch_v" data-v="1" onclick="toggleChip(this)">Vascular Disease (+1)</button>
            <button class="chip" data-g="ch_a1" data-v="1" onclick="toggleChip(this)">Age 65–74 (+1)</button>
            <button class="chip" data-g="ch_sex" data-v="1" onclick="toggleChip(this)">Female Sex (+1)</button>
        </div>

        <button class="calc-btn" onclick="calc_chads2()">Calculate</button>
        <div id="R"></div>
    </div>
  </main>

  <script src="../js/translations.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/calculators.js"></script> 
</body>
</html>
