<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CHA₂DS₂-VASc — WardCalc</title>
  
  <meta name="description" content="Professional clinical calculator for medical rounds. Part of the WardCalc decision support system.">
  <meta name="keywords" content="medical calculator, clinical tool, wardcalc, medicine, diagnosis, Bukhara State Medical Institute">
  <meta name="author" content="Muhammad Sabir Ali">

  <meta property="og:title" content="WardCalc - Clinical Tool">
  <meta property="og:description" content="Evidence-based medical calculator for clinical rotations. Fast, reliable, and mobile-friendly.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://wardcalc.com/profile.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://wardcalc.com/profile.png">

  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav>
    <a class="logo" href="../index.html"><div class="logo-text">Ward<em>Calc</em></div></a>
    <div class="lang-sw">
      <button class="lang-btn active" onclick="setLang('en',this)">EN</button>
      <button class="lang-btn" onclick="setLang('ru',this)">RU</button>
      <button class="lang-btn" onclick="setLang('uz',this)">UZ</button>
    </div>
  </nav>

  <main class="main">
    <div class="calc-container">
        <a href="../index.html" class="close-btn">&times;</a>
        <div class="spec-tag" data-k="sp_cardio">Cardiology</div>
        <h1 style="color:var(--gold);font-size:28px;margin-bottom:8px;">CHA₂DS₂-VASc Score</h1>
        <p style="color:var(--w60);font-size:14px;margin-bottom:25px;" data-k="d_chads2"></p>

        <div style="display:grid;gap:8px;margin-bottom:25px;">
            <button class="chip" data-g="ch_c" data-v="1" onclick="toggleChip(this)">C: Heart Failure (+1)</button>
            <button class="chip" data-g="ch_h" data-v="1" onclick="toggleChip(this)">H: Hypertension (+1)</button>
            <button class="chip" data-g="ch_a2" data-v="2" onclick="toggleChip(this)">A: Age ≥ 75 (+2)</button>
            <button class="chip" data-g="ch_d" data-v="1" onclick="toggleChip(this)">D: Diabetes (+1)</button>
            <button class="chip" data-g="ch_s2" data-v="2" onclick="toggleChip(this)">S: Stroke/TIA/TE (+2)</button>
            <button class="chip" data-g="ch_v" data-v="1" onclick="toggleChip(this)">V: Vascular Disease (+1)</button>
            <button class="chip" data-g="ch_a1" data-v="1" onclick="toggleChip(this)">A: Age 65–74 (+1)</button>
            <button class="chip" data-g="ch_sex" data-v="1" onclick="toggleChip(this)">S: Sex (Female) (+1)</button>
        </div>

        <button class="calc-btn" onclick="window.calc_chads2()" style="background:var(--gold);color:#000;font-weight:700;padding:16px;width:100%;border-radius:12px;border:none;" data-k="btn"></button>
        <div id="R" style="margin-top:20px;"></div>
    </div>

    <div style="max-width:600px;margin:20px auto 50px;">
        <div style="padding:20px;background:var(--bg2);border-radius:12px;border:1px dashed var(--w20);margin-bottom:15px;">
            <div style="font-family:monospace;font-size:10px;color:var(--w40);text-transform:uppercase;margin-bottom:10px;">Clinical Memory Aid</div>
            <div style="color:var(--gold);font-family:monospace;font-size:13px;">CHADS-VASc: Failure, HTN, Age(75), DM, Stroke(2), Vascular, Age(65), Sex.</div>
        </div>
        <div style="padding:20px;background:var(--bg2);border-radius:12px;border:1px solid var(--border);">
            <h3 data-k="chads_info_title" style="color:var(--gold);margin-bottom:10px;font-size:16px;"></h3>
            <p data-k="chads_info_p1" style="color:var(--w60);font-size:13px;line-height:1.6;margin-bottom:10px;"></p>
            <p data-k="chads_info_p2" style="color:var(--w60);font-size:13px;line-height:1.6;"></p>
        </div>
    </div>
  </main>
  <script src="../js/translations.js"></script><script src="../js/ui.js"></script><script src="../js/calculators.js"></script> 
</body>
</html>
