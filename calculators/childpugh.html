<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Child-Pugh Score — WardCalc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="bg-wrap" aria-hidden="true">
    <div class="bg-mesh"></div><div class="bg-grid"></div><div class="bg-noise"></div>
    <div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div>
  </div>

  <nav>
    <a class="logo" href="../index.html">
      <div class="logo-mark"><svg width="22" height="16" viewBox="0 0 22 16" fill="none"><path d="M1 8L4 8L6 2L8 14L10 5L12 11L14 8L21 8" stroke="var(--gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div><div class="logo-text">Ward<em>Calc</em></div></div>
    </a>
    <div class="lang-sw">
      <button class="lang-btn active" onclick="setLang('en',this)">EN</button>
      <button class="lang-btn" onclick="setLang('ru',this)">RU</button>
      <button class="lang-btn" onclick="setLang('uz',this)">UZ</button>
    </div>
  </nav>

  <main class="main" style="padding-top: 20px;">
    
    <div style="max-width: 600px; margin: 0 auto 20px;">
        <div class="ad-banner" style="background: rgba(255,255,255,0.02); border: 1px dashed var(--w20); border-radius: 15px; padding: 20px; text-align: center; color: var(--w40); font-family: var(--mono); font-size: 11px; letter-spacing: 1px; text-transform: uppercase;">
            AdSense Space (Top Banner)
        </div>
    </div>

    <div class="calc-container" style="background: var(--bg2); border: 1px solid var(--border); border-radius: 20px; padding: 30px; position: relative; max-width: 600px; margin: 0 auto;">
        
        <a href="../index.html" class="close-btn" style="position: absolute; top: 20px; right: 25px; font-size: 28px; color: var(--w40); text-decoration: none; line-height: 1;">&times;</a>

        <div class="spec-tag" style="display: inline-block; background: rgba(212, 175, 55, 0.1); color: var(--gold); padding: 4px 12px; border-radius: 12px; font-size: 11px; font-family: var(--mono); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 15px;" data-k="sp_gastro"></div>

        <h1 style="color: var(--gold); font-size: 32px; font-weight: 700; margin-bottom: 10px; font-family: 'Playfair Display', serif;">Child-Pugh Score</h1>
        <p style="color: var(--w60); font-size: 14px; margin-bottom: 30px;" data-k="d_cp"></p>

        <div class="input-group" style="margin-bottom: 20px;">
            <label style="display:block; color:var(--w80); font-size:14px; margin-bottom:10px;" data-k="f_bili"></label>
            <div class="chip-row" style="flex-direction: column;">
                <button class="chip" data-g="cb" data-v="1" onclick="pickChip(this)" data-k="cp_b1" style="width: 100%; text-align: left;"></button>
                <button class="chip" data-g="cb" data-v="2" onclick="pickChip(this)" data-k="cp_b2" style="width: 100%; text-align: left;"></button>
                <button class="chip" data-g="cb" data-v="3" onclick="pickChip(this)" data-k="cp_b3" style="width: 100%; text-align: left;"></button>
            </div>
        </div>

        <div class="input-group" style="margin-bottom: 20px;">
            <label style="display:block; color:var(--w80); font-size:14px; margin-bottom:10px;" data-k="f_alb"></label>
            <div class="chip-row" style="flex-direction: column;">
                <button class="chip" data-g="ca" data-v="1" onclick="pickChip(this)" data-k="cp_a1" style="width: 100%; text-align: left;"></button>
                <button class="chip" data-g="ca" data-v="2" onclick="pickChip(this)" data-k="cp_a2" style="width: 100%; text-align: left;"></button>
                <button class="chip" data-g="ca" data-v="3" onclick="pickChip(this)" data-k="cp_a3" style="width: 100%; text-align: left;"></button>
            </div>
        </div>

        <div class="input-group" style="margin-bottom: 20px;">
            <label style="display:block; color:var(--w80); font-size:14px; margin-bottom:10px;" data-k="f_pt"></label>
            <div class="chip-row" style="flex-direction: column;">
                <button class="chip" data-g="cp" data-v="1" onclick="pickChip(this)" data-k="cp_p1" style="width: 100%; text-align: left;"></button>
                <button class="chip" data-g="cp" data-v="2" onclick="pickChip(this)" data-k="cp_p2" style="width: 100%; text-align: left;"></button>
                <button class="chip" data-g="cp" data-v="3" onclick="pickChip(this)" data-k="cp_p3" style="width: 100%; text-align: left;"></button>
            </div>
        </div>

        <div class="input-group" style="margin-bottom: 20px;">
            <label style="display:block; color:var(--w80); font-size:14px; margin-bottom:10px;" data-k="f_ascites"></label>
            <div class="chip-row" style="flex-direction: column;">
                <button class="chip" data-g="casc" data-v="1" onclick="pickChip(this)" data-k="no" style="width: 100%; text-align: left;"></button>
                <button class="chip" data-g="casc" data-v="2" onclick="pickChip(this)" data-k="cp_as2" style="width: 100%; text-align: left;"></button>
                <button class="chip" data-g="casc" data-v="3" onclick="pickChip(this)" data-k="cp_as3" style="width: 100%; text-align: left;"></button>
            </div>
        </div>

        <div class="input-group" style="margin-bottom: 30px;">
            <label style="display:block; color:var(--w80); font-size:14px; margin-bottom:10px;" data-k="f_enceph"></label>
            <div class="chip-row" style="flex-direction: column;">
                <button class="chip" data-g="ce" data-v="1" onclick="pickChip(this)" data-k="no" style="width: 100%; text-align: left;"></button>
                <button class="chip" data-g="ce" data-v="2" onclick="pickChip(this)" data-k="cp_e2" style="width: 100%; text-align: left;"></button>
                <button class="chip" data-g="ce" data-v="3" onclick="pickChip(this)" data-k="cp_e3" style="width: 100%; text-align: left;"></button>
            </div>
        </div>

        <button class="calc-btn" onclick="calc_childpugh()" data-k="btn" style="width: 100%; padding: 18px; background: var(--gold); color: #000; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; margin-top: 10px; cursor: pointer; transition: 0.2s;"></button>

        <div id="R" style="margin-top: 20px; display: block;"></div>

        <div style="margin-top: 30px;">
            <div class="ad-banner" style="background: rgba(255,255,255,0.02); border: 1px dashed var(--w20); border-radius: 15px; padding: 20px; text-align: center; color: var(--w40); font-family: var(--mono); font-size: 11px; letter-spacing: 1px; text-transform: uppercase;">
                AdSense Space (Below Results)
            </div>
        </div>
    </div>

    <div style="max-width: 600px; margin: 20px auto 50px;">
        <div style="padding: 25px; background: var(--bg2); border-radius: 15px; border: 1px dashed var(--w20); margin-bottom: 20px;">
            <div style="font-family: var(--mono); font-size: 10px; color: var(--w40); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 15px;" data-k="mnem_all"></div>
            <div style="color: var(--gold); font-family: var(--mono); font-size: 13px; line-height: 2.2;">
                🇬🇧 <b>B</b>ilirubin · <b>A</b>lbumin · <b>P</b>T/INR · <b>A</b>scites · <b>E</b>nceph — "<b>BAPAE</b>"<br>
                🇷🇺 <b>Б</b>илирубин · <b>А</b>льбумин · <b>П</b>В/МНО · <b>А</b>сцит · <b>Э</b>нцеф — "<b>БАПАЭ</b>"<br>
                🇺🇿 <b>B</b>ilirubin · <b>A</b>lbumin · <b>P</b>T/INR · <b>A</b>ssit · <b>E</b>nsefalopatiya — "<b>BAPAE</b>"
            </div>
        </div>

        <div style="padding: 25px; background: var(--bg2); border-radius: 15px;">
            <h3 data-k="cp_info_title" style="color: var(--white); margin-bottom: 15px; font-size: 18px; font-weight: 500;"></h3>
            <p data-k="cp_info_p1" style="color: var(--w60); font-size: 14px; line-height: 1.6; margin-bottom: 15px;"></p>
            <p data-k="cp_info_p2" style="color: var(--w60); font-size: 14px; line-height: 1.6; margin-bottom: 15px;"></p>
            <p style="color: var(--w80); font-size: 14px; margin-top: 20px; border-top: 1px solid var(--border); padding-top: 15px;"><b><span data-k="cp_info_p3"></span></b></p>
        </div>
    </div>

  </main>

  <script src="../js/translations.js?v=7"></script>
  <script src="../js/drugs.js?v=7"></script>
  <script src="../js/ui.js?v=7"></script>
  <script src="../js/calculators.js?v=7"></script> 
  <script src="../js/main.js?v=7"></script>

</body>
</html>
