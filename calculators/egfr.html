<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>eGFR (CKD-EPI) — WardCalc</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="bg-wrap" aria-hidden="true">
    <div class="bg-mesh"></div><div class="bg-grid"></div><div class="bg-noise"></div>
    <div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div>
  </div>

  <nav>
    <a class="logo" href="../index.html">
      <div class="logo-mark"><svg width="22" height="16" viewBox="0 0 22 16" fill="none"><path d="M1 8L4 8L6 2L8 14L10 5L12 11L14 8L21 8" stroke="var(--gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div><div class="logo-text">Ward<em>Calc</em></div></div>
    </a>
    <div class="lang-sw">
      <button class="lang-btn active" onclick="setLang('en',this)">EN</button>
      <button class="lang-btn" onclick="setLang('ru',this)">RU</button>
      <button class="lang-btn" onclick="setLang('uz',this)">UZ</button>
    </div>
  </nav>

  <main class="main" style="padding-top: 20px;">
    
    <div style="max-width: 600px; margin: 0 auto 20px;">
        <div class="ad-banner" style="background: rgba(255,255,255,0.02); border: 1px dashed var(--w20); border-radius: 15px; padding: 20px; text-align: center; color: var(--w40); font-family: var(--mono); font-size: 11px; letter-spacing: 1px; text-transform: uppercase;">
            AdSense Space (Top Banner)
        </div>
    </div>

    <div class="calc-container" style="background: var(--bg2); border: 1px solid var(--border); border-radius: 20px; padding: 30px; position: relative; max-width: 600px; margin: 0 auto;">
        
        <a href="../index.html" class="close-btn" style="position: absolute; top: 20px; right: 25px; font-size: 28px; color: var(--w40); text-decoration: none; line-height: 1;">&times;</a>

        <div class="spec-tag" style="display: inline-block; background: rgba(212, 175, 55, 0.1); color: var(--gold); padding: 4px 12px; border-radius: 12px; font-size: 11px; font-family: var(--mono); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 15px;" data-k="sp_gen"></div>

        <h1 style="color: var(--gold); font-size: 32px; font-weight: 700; margin-bottom: 10px; font-family: 'Playfair Display', serif;">eGFR (CKD-EPI)</h1>
        <p style="color: var(--w60); font-size: 14px; margin-bottom: 30px;" data-k="d_egfr"></p>

        <div class="input-group" style="margin-bottom: 20px;">
            <label style="display:block; color:var(--w80); font-size:14px; margin-bottom:10px;" data-k="f_cr"></label>
            <div class="num-input-wrap" style="display: flex; align-items: center; background: var(--bg3); border-radius: 10px; padding: 0 15px; border: 1px solid rgba(255,255,255,0.1);">
                <input class="num-field" type="number" id="ecr" placeholder="e.g. 90" min="10" style="background: transparent; border: none; color: var(--gold); font-size: 20px; font-weight: bold; width: 100%; padding: 15px 0; outline: none; text-align: right; font-family: var(--mono);">
                <span class="num-unit" style="color: var(--w60); margin-left: 10px; font-size: 14px; font-weight: 600;">μmol/L</span>
            </div>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom: 20px;">
            <div class="input-group" style="margin-bottom: 0;">
                <label style="display:block; color:var(--w80); font-size:14px; margin-bottom:10px;" data-k="f_age"></label>
                <div class="num-input-wrap" style="display: flex; align-items: center; background: var(--bg3); border-radius: 10px; padding: 0 15px; border: 1px solid rgba(255,255,255,0.1);">
                    <input class="num-field" type="number" id="eage" placeholder="45" min="18" max="110" style="background: transparent; border: none; color: var(--gold); font-size: 20px; font-weight: bold; width: 100%; padding: 15px 0; outline: none; text-align: right; font-family: var(--mono);">
                </div>
            </div>

            <div class="input-group" style="margin-bottom: 0;">
                <label style="display:block; color:var(--w80); font-size:14px; margin-bottom:10px;" data-k="f_sex"></label>
                <div class="chip-row">
                    <button class="chip" data-g="esex" data-v="M" onclick="pickChip(this)" data-k="sex_m"></button>
                    <button class="chip" data-g="esex" data-v="F" onclick="pickChip(this)" data-k="sex_f"></button>
                </div>
            </div>
        </div>

        <button class="calc-btn" onclick="calc_egfr()" data-k="btn" style="width: 100%; padding: 18px; background: var(--gold); color: #000; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; margin-top: 10px; cursor: pointer; transition: 0.2s;"></button>

        <div id="R" style="margin-top: 20px; display: block;"></div>

        <div style="margin-top: 30px;">
            <div class="ad-banner" style="background: rgba(255,255,255,0.02); border: 1px dashed var(--w20); border-radius: 15px; padding: 20px; text-align: center; color: var(--w40); font-family: var(--mono); font-size: 11px; letter-spacing: 1px; text-transform: uppercase;">
                AdSense Space (Below Results)
            </div>
        </div>
    </div>

    <div style="max-width: 600px; margin: 20px auto 50px;">
        
        <div style="padding: 25px; background: var(--bg2); border-radius: 15px; border: 1px dashed var(--w20); margin-bottom: 20px;">
            <div style="font-family: var(--mono); font-size: 10px; color: var(--w40); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 15px;" data-k="mnem_all"></div>
            <div style="color: var(--gold); font-family: var(--mono); font-size: 13px; line-height: 2.2;">
                🌍 <b>G1</b> ≥90 · <b>G2</b> 60–89 · <b>G3a</b> 45–59 · <b>G3b</b> 30–44 · <b>G4</b> 15–29 · <b>G5</b> &lt;15
            </div>
        </div>

        <div style="padding: 25px; background: var(--bg2); border-radius: 15px; border: 1px solid var(--border);">
            <h3 data-k="egfr_info_title" style="color: var(--gold); margin-bottom: 15px; font-size: 18px; font-weight: 600; font-family: 'Playfair Display', serif;"></h3>
            
            <p data-k="egfr_info_p1" style="color: var(--w60); font-size: 14px; line-height: 1.6; margin-bottom: 15px;"></p>
            
            <p data-k="egfr_info_p2" style="color: var(--w60); font-size: 14px; line-height: 1.6; margin-bottom: 15px;"></p>
            
            <p style="color: var(--white); font-size: 14px; margin-top: 20px; border-top: 1px solid var(--border); padding-top: 15px;">
                <b><span data-k="egfr_info_p3"></span></b>
            </p>
        </div>
    </div>

  </main>

  <script src="../js/translations.js?v=12"></script>
  <script src="../js/drugs.js?v=12"></script>
  <script src="../js/ui.js?v=12"></script>
  <script src="../js/calculators.js?v=12"></script> 
  <script src="../js/main.js?v=12"></script>

</body>
</html>
