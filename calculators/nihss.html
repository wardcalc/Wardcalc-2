<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIHSS Stroke Scale - WardCalc</title>
    <!-- Connects to your main CSS file -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body style="background-color: var(--bg, #0f111a); margin: 0; font-family: system-ui, -apple-system, sans-serif;">

    <!-- Top Navigation Bar -->
    <nav class="navbar" style="display: flex; justify-content: space-between; padding: 20px 40px; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05);">
        <!-- Points back to the main menu -->
        <a href="../index.html" style="color: var(--white, #fff); text-decoration: none; font-size: 20px; font-weight: bold; display: flex; align-items: center; gap: 10px;">
            <span style="background: var(--bg3, #222); padding: 8px 12px; border-radius: 8px; color: var(--gold, #d4af37);">🫀</span> WardCalc
        </a>
        
        <div class="lang-switch" style="display: flex; gap: 5px; background: rgba(255,255,255,0.05); padding: 5px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);">
            <button class="lang-btn active" onclick="setLang('en', this)" style="background: var(--gold, #d4af37) !important; color: #000 !important; border: none; padding: 6px 14px; border-radius: 15px; cursor: pointer; font-size: 11px; font-weight: 700; letter-spacing: 1px;">EN</button>
            <button class="lang-btn" onclick="setLang('ru', this)" style="background: transparent !important; color: var(--w60, #888) !important; border: none; padding: 6px 14px; border-radius: 15px; cursor: pointer; font-size: 11px; font-weight: 700; letter-spacing: 1px;">RU</button>
            <button class="lang-btn" onclick="setLang('uz', this)" style="background: transparent !important; color: var(--w60, #888) !important; border: none; padding: 6px 14px; border-radius: 15px; cursor: pointer; font-size: 11px; font-weight: 700; letter-spacing: 1px;">UZ</button>
        </div>
    </nav>

    <!-- Main Content -->
    <div style="padding: 20px; max-width: 800px; margin: 40px auto;">
        <div class="content-card" style="background: var(--bg2, #1a1b26); padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.05);">
            
            <h2 style="color: var(--white, #fff); margin-bottom: 10px; font-size: 28px;">NIHSS Stroke Scale</h2>
            
            <!-- Translated Description -->
            <p data-k="d_nihss" style="color: var(--w60, #888); font-style: italic; font-size: 15px; margin-bottom: 30px; line-height: 1.6;">
                Quantify stroke severity. Guides thrombolysis and thrombectomy. Time is brain.
            </p>

            <!-- Input Box -->
            <div style="margin-bottom: 25px;">
                <label data-k="f_nihss" style="display: block; color: var(--w60, #888); font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px;">Total NIHSS Score (0–42)</label>
                <!-- IMPORTANT: id="nihss_s" must be here for math to work -->
                <input type="number" id="nihss_s" min="0" max="42" placeholder="0-42" style="width: 100%; box-sizing: border-box; background: var(--bg3, #222); border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; color: #fff; font-size: 16px; outline: none;">
            </div>

            <!-- Translated Calculate Button -->
            <!-- IMPORTANT: onclick="calc_nihss()" triggers the math -->
            <button data-k="btn" onclick="calc_nihss()" style="width: 100%; background: rgba(212, 175, 55, 0.1); border: 1px solid var(--gold, #d4af37); color: var(--gold, #d4af37); padding: 15px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 20px; transition: all 0.2s;">
                Calculate
            </button>

            <!-- 🚨 THIS IS WHERE THE RESULT APPEARS 🚨 -->
            <div id="R"></div>

            <!-- AdSense Placeholder -->
            <div style="margin-top: 20px; padding: 20px; border: 1px dashed rgba(255,255,255,0.1); border-radius: 10px; text-align: center; color: var(--w40, #555); font-size: 12px; letter-spacing: 2px;">
                ADSENSE SPACE
            </div>

            <!-- Translated Memory Aid -->
            <div style="margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px;">
                <h4 data-k="mnem_all" style="color: var(--gold, #d4af37); font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 15px;">Memory Aid — All 3 Languages</h4>
                <p style="color: var(--w80, #cbd5e1); font-size: 13px; line-height: 1.6; font-family: monospace;">
                    🌍 <strong>0</strong> None &nbsp;·&nbsp; <strong>1–4</strong> Minor &nbsp;·&nbsp; <strong>5–15</strong> Moderate &nbsp;·&nbsp; <strong>16–20</strong> Mod-Severe &nbsp;·&nbsp; <strong>21–42</strong> Severe
                </p>
            </div>

        </div>
    </div>

    <!-- Connects to your JavaScript -->
    <script src="../js/global.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof updateUI === 'function') updateUI();
        });
    </script>
</body>
</html>
